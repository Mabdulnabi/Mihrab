<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="photo" class="layer">
    <div class="photo" id="photoA"></div>
    <div class="photo" id="photoB"></div>
    <div class="shade"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span><span class="wx"></span></div>
      <div id="azkar">
        <div class="az-head"></div>
        <div class="az-text"></div>
        <div class="az-src"></div>
        <div class="az-dots"></div>
      </div>
      <div id="netbadge" class="badge"><span class="bi wifi"></span></div>
      <div id="btbadge" class="badge"><span class="bi bt"></span></div>
      <div id="islamic">
        <div class="ik-head"></div>
        <div class="ik-prayer"></div>
        <div class="ik-left"></div>
        <div class="ik-hadith"></div>
        <div class="ik-src"></div>
        <div class="ik-radio"><span class="rp-play"></span><span class="rp-t"></span><span class="rp-auto">AUTO</span><span class="rp-list"></span></div>
      </div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="radiolist" class="sheet"><div class="box"><div class="title"></div><div class="list"><div class="rows"></div></div></div></div>
  <div id="saver" class="layer">
    <div class="photo" id="sphotoA"></div>
    <div class="photo" id="sphotoB"></div>
    <div class="shade"></div>
    <div class="sv-frame"></div>
    <div class="sv-wx"><div class="sv-temp"></div><div class="sv-sub"></div><div class="sv-gold"></div></div>
    <div class="sv-date"><div class="sv-hijri"></div><div class="sv-greg"></div></div>
    <div class="sv-clock"><span class="sv-mer"></span><div class="sv-time"></div><div class="sv-tz"></div></div>
    <div class="sv-card"><div class="sv-head"></div><div class="sv-h"></div><div class="sv-s"></div><div class="sv-dots"></div></div>
    <div class="sv-line"></div>
    <div class="sv-panel sv-ram"><div class="t"></div><div class="m"></div></div>
    <div class="sv-prayers"></div>
  </div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="hadiths.js"></script>
<script src="azkar.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
